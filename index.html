<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0F" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Eorix builds a unified FinOps dashboard for AWS, Microsoft Azure, and Google Cloud. Spot cost anomalies early, allocate cloud spend by team, and maximize cloud commitments."
    />
    <meta name="keywords" content="FinOps dashboard, cloud cost management, AWS cost optimization, Azure cost management, Google Cloud billing, multi-cloud spend, cloud waste reduction" />
    <meta name="author" content="Eorix" />
    <link rel="canonical" href="https://eorix.cloud/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eorix.cloud/" />
    <meta property="og:title" content="Eorix — Multi-Cloud FinOps Dashboard" />
    <meta property="og:description" content="One view of every cloud bill. Eorix provides a unified multi-cloud FinOps dashboard for AWS, Azure, and Google Cloud." />
    <meta property="og:image" content="/band-logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eorix — Multi-Cloud FinOps Dashboard" />
    <meta name="twitter:description" content="One view of every cloud bill. Real-time cost allocation, anomaly alerts, and commitment tracking." />
    <meta name="twitter:image" content="/band-logo.png" />
    
    <!-- Security meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Eorix",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Cloud-based",
        "description": "Unified Multi-Cloud FinOps Dashboard for AWS, Microsoft Azure, and Google Cloud.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/PreOrder"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Eorix",
          "url": "https://eorix.cloud"
        }
      }
    </script>

    <title>Eorix — Multi-Cloud FinOps Dashboard</title>
    <link rel="icon" type="image/png" href="/brand-mark.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Michroma&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
